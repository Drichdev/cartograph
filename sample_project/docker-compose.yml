services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
      - mongo
  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      - redis
      - mongo
  redis:
    image: redis:7-alpine
  mongo:
    image: mongo:7
